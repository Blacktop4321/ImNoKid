name: Build Locus MPH IPA

on:
  push:
    branches: [locus-mph-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out build inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out original Locus source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ChrisMack32/Locus
          ref: 83c8fb324983728e8f44759cfd834dc637ee38b5
          path: locus
          persist-credentials: false

      - name: Apply mph changes
        run: cp -R locus-changes/. locus/

      - name: Install project generator
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodebuild -version

      - name: Check speed math and build unsigned IPA
        working-directory: locus
        run: bash scripts/build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Locus-MPH-unsigned
          path: locus/dist/Locus-MPH-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Locus-MPH-build-log
          path: locus/build-mph/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
