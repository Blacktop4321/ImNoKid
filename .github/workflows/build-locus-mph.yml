name: Build Locus native speed test kit

on:
  push:
    branches: [locus-mph-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out build inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out original Locus source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ChrisMack32/Locus
          ref: 83c8fb324983728e8f44759cfd834dc637ee38b5
          path: locus
          persist-credentials: false

      - name: Apply playback and movement check changes
        run: cp -R locus-changes/. locus/

      - name: Install project generator
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodebuild -version

      - name: Check speed math and build unsigned IPA
        working-directory: locus
        run: bash scripts/build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Locus-1.0.5-unsigned
          path: locus/dist/Locus-MPH-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Locus-1.0.5-build-log
          path: locus/build-mph/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  native-speed-helper:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out build inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out pinned WebDriverAgent source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: appium/WebDriverAgent
          ref: 2e98ac0ad4dbc99ab7c8bb01b7216fde252afb54
          path: webdriveragent
          persist-credentials: false

      - name: Validate Windows launcher syntax
        shell: pwsh
        run: |
          $locusParseErrors = $null
          $locusParseTokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/native-speed-helper/windows/Start-Native-Speed.ps1",
            [ref]$locusParseTokens, [ref]$locusParseErrors) | Out-Null
          if ($locusParseErrors.Count) { throw ($locusParseErrors | Out-String) }

      - name: Build native speed helper IPA
        run: bash native-speed-helper/build_helper.sh webdriveragent native-speed-dist

      - name: Upload helper IPA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Locus-Native-Speed-Helper-unsigned
          path: native-speed-dist/Locus-Native-Speed-Helper-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload helper build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Locus-Native-Speed-Helper-build-log
          path: native-speed-dist/helper-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
